# Disposable test cluster. No production credentials and no host-published ports.
# Run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from test
# Then: docker compose -f compose.test.yaml down --volumes
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: racing_test_owner
      POSTGRES_PASSWORD: racing_disposable_test_password
      POSTGRES_DB: racing_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racing_test_owner -d racing_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://racing_test_owner:racing_disposable_test_password@postgres:5432/racing_test
      RACING_ALLOW_TEST_DATABASE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "test:all"]
