name: Verify racing escrow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: racing-escrow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: racing_test_owner
          POSTGRES_PASSWORD: racing_disposable_test_password
          POSTGRES_DB: racing_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U racing_test_owner -d racing_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Deterministic HTTP and SQL tests
        run: |
          mkdir -p reports
          node --test --test-reporter=junit --test-reporter-destination=reports/unit.xml test/*.test.js
      - name: Independent-session PostgreSQL concurrency tests
        env:
          DATABASE_URL: postgres://racing_test_owner:racing_disposable_test_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/racing_test
          RACING_ALLOW_TEST_DATABASE: "1"
        run: node --test --test-reporter=junit --test-reporter-destination=reports/native.xml test/native-concurrency.integration.js
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-${{ matrix.postgres }}-test-reports
          path: reports/*.xml
          if-no-files-found: warn
          retention-days: 14
